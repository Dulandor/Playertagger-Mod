plugins {
    id "net.fabricmc.fabric-loom-remap" version "1.17.0-alpha.8"
    id "ploceus" version "1.17.4"
}

version = "1.0.0"
group = "com.karl.playertagger"
base {
    archivesName = "playertagger-1.8.9-fabric"
}

ploceus {
    setIntermediaryGeneration(2)
}

repositories {
    mavenLocal()
    mavenCentral()
    google()
    maven { url = "https://maven.ornithemc.net/releases" }
    maven { url = "https://maven.ornithemc.net/snapshots" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://repo.polyfrost.org/releases" }
    maven { url = "https://repo.polyfrost.org/snapshots" }
    maven { url = "https://redirector.kotlinlang.org/maven/compose-dev" }
    maven { url = "https://maven.cloverclient.com/releases" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.8.9"
    mappings ploceus.mcpMappings("stable", "1.8.9", "22")
    modImplementation "net.fabricmc:fabric-loader:0.20.1"

    compileOnly("org.polyfrost.oneconfig:1.8.9-ornithe:1.7.0") {
        transitive = false
    }
    for (String module : ["commands", "config", "config-impl", "events", "internal", "ui", "utils", "hud"]) {
        compileOnly "org.polyfrost.oneconfig:${module}:1.7.0"
    }
    compileOnly "com.mojang:brigadier:1.0.18"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property "version", project.version

    filesMatching(["fabric.mod.json", "mixins.playertagger.json"]) {
        expand "version": project.version
    }
}
